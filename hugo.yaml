baseURL: "https://zoeyyang404.github.io/"
languageCode: "en-gb"
locale: "en-GB"
title: "Ziyang Yang"
theme: "stacknote"
enableRobotsTXT: true

pagination:
  pagerSize: 10

outputs:
  home: [HTML, RSS]

sitemap:
  changefreq: monthly
  priority: 0.5
  filename: sitemap.xml

  
params:
  author: "Ziyang Yang"
  description: "Ziyang Yang (Zoey Yang), statistician working on time series forecasting and anomaly detection."
  keywords:
    - "Zoey Yang"
    - "Ziyang Yang"
    - "time series"
    - "anomaly detection"
  math: true
  authorInitials: "ZY"
  profileImage: "images/cube.png"
  profileImageAlt: "Cube, a fluffy grey cat, resting in the sunlight."
  profileCaption: "This is my cat Cube."
  role: "Statistician & data scientist"
  tagline: "A living notebook on statistics, data, and learning."
  aboutIntro: "I'm a data scientist with a PhD in Statistics from Lancaster University. My work focuses on time series forecasting and anomaly detection. On this website, I share what I'm learning and the experiences I gain along the way."
  mainSection: posts
  authorPage: /about-me/
  showToc: true
  showTopics: false
  minTagPostsToIndex: 1
  showAbout: false # The homepage override places this text in the opening section.
  showNewsletter: false
  github: "https://github.com/zoeyyang404"
  themeColor: "#fafaf7"
  socialLinks:
    - name: github
      url: "https://github.com/zoeyyang404"
    - name: linkedin
      url: "https://www.linkedin.com/in/statistics-ziyang-yang"
    - name: rss
      url: /index.xml

markup:
  goldmark:
    renderer:
      unsafe: true # Existing articles contain HTML images and formatted text.
    extensions:
      passthrough:
        enable: true
        delimiters:
          block:
            - - "$$"
              - "$$"
            - - '\['
              - '\]'
          inline:
            - - "$"
              - "$"
            - - '\('
              - '\)'
menu:
  main:
    - name: Blog
      url: /posts/
      weight: 10
    - name: About Me
      url: /about-me/
      weight: 20
    - name: Publications
      url: /publications/
      weight: 30

