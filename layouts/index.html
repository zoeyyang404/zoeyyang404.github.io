{{ define "main" }}
  <section class="hero" aria-labelledby="home-intro-title">
    <div class="hero__left">
      <h1 class="visually-hidden" id="home-intro-title">{{ .Site.Title }}</h1>
      <p class="hero__sub">{{ .Site.Params.aboutIntro }}</p>
      <div class="about__links">
        {{ with .Site.Params.github }}<a class="about__link" href="{{ . }}" target="_blank" rel="noopener noreferrer">{{ i18n "github" }} →</a>{{ end }}
        <a class="about__link" href="{{ .Site.Params.authorPage | default "/about/" | relURL }}">{{ i18n "about" }} →</a>
      </div>
    </div>
    <figure class="hero__right hero__profile">
      {{ with resources.Get .Site.Params.profileImage }}
        {{ $small := .Resize "480x webp q85" }}
        {{ $large := .Resize "960x webp q85" }}
        <div class="hero__portrait hero__portrait--photo">
          <img src="{{ $large.RelPermalink }}"
               srcset="{{ $small.RelPermalink }} 480w, {{ $large.RelPermalink }} 960w"
               sizes="(max-width: 38rem) 200px, (max-width: 52rem) 248px, 320px"
               width="{{ $large.Width }}" height="{{ $large.Height }}"
               alt="{{ $.Site.Params.profileImageAlt }}"
               loading="eager" fetchpriority="high" decoding="async">
        </div>
      {{ end }}
      <figcaption class="hero__caption">{{ .Site.Params.profileCaption }}</figcaption>
    </figure>
  </section>
{{ end }}
