<meta name="google-site-verification" content="vOrBLaDzb2rXy_sYCSkdHwjTgNn-mjuH-joa2LeEQxw">
<meta name="author" content="{{ site.Params.author }}">
{{ with site.Params.keywords }}<meta name="keywords" content="{{ delimit . ", " }}">{{ end }}

{{- $style := resources.Get "css/site.css" | minify | fingerprint -}}
<link rel="stylesheet" href="{{ $style.RelPermalink }}" integrity="{{ $style.Data.Integrity }}">

{{- if and .IsPage (.Param "math") -}}
<link rel="stylesheet" href="{{ "vendor/katex/katex.min.css" | relURL }}">
<script defer src="{{ "vendor/katex/katex.min.js" | relURL }}"></script>
<script defer src="{{ "vendor/katex/auto-render.min.js" | relURL }}"></script>
{{- $math := resources.Get "js/math.js" | minify | fingerprint -}}
<script defer src="{{ $math.RelPermalink }}" integrity="{{ $math.Data.Integrity }}"></script>
{{- end -}}
